<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="overlay">

        <div class="login-box">

            <h1>Account Login</h1>

            <input class="txt" type="text" placeholder="User Name">

            <input class="txt" type="password" placeholder="Password">

            <button>LOGIN</button>

            <div class="bottom">

                <label>
                    <input class="check" type="checkbox">
                    remember me
                </label>

                <a href="#">Forgot Password?</a>

            </div>

        </div>

    </div>

</body>

</html>
